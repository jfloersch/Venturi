name: Venturi acceptance checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.7'
      - run: uv sync --locked --extra cad --extra dev
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: python3 scripts/bootstrap_worker.py
      - run: uv run venturi doctor
      - run: uv run pytest -q
        env:
          VENTURI_INTEGRATION: '1'
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: npm run tauri build -- --no-bundle
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: uv sync --locked --extra cad --extra dev
      - run: python3 scripts/bootstrap_worker.py
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-evidence
          path: |
            artifacts/screenshots
            apps/desktop/test-results
