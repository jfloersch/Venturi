name: Build reviewable beta installers
on:
  workflow_dispatch:
    inputs:
      managed_url:
        description: Optional reviewed HTTPS Managed gateway
        required: false
        default: ''
      sign_windows:
        description: Sign Windows installer using the release environment certificate
        type: boolean
        default: false
      sign_artifacts:
        description: Create detached artifact signatures using the release signing key
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  worker-payload:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.7'
      - run: uv run python scripts/build_release.py --managed-url "$VENTURI_RELEASE_MANAGED_URL"
        env:
          VENTURI_RELEASE_MANAGED_URL: ${{ inputs.managed_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-payload
          path: artifacts/release/
  desktop:
    needs: worker-payload
    environment: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: worker-payload
          path: artifacts/release
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev patchelf
      - name: Prepare embedded worker payload
        shell: bash
        run: |
          tar -xzf artifacts/release/venturi-worker-*-linux-x86_64.tar.gz -C apps/desktop/src-tauri
          node -e 'require("fs").writeFileSync("apps/desktop/src-tauri/release-config.json", JSON.stringify({bundle:{resources:{"worker-payload/":"worker-payload/"}}}))'
      - name: Import signing certificate
        if: runner.os == 'Windows' && inputs.sign_windows
        shell: pwsh
        env:
          VENTURI_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          VENTURI_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:VENTURI_CERTIFICATE -or -not $env:VENTURI_CERTIFICATE_PASSWORD) { throw "Signing credentials are required." }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'venturi-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:VENTURI_CERTIFICATE))
          $password = ConvertTo-SecureString $env:VENTURI_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $certificatePath
          $config = Get-Content apps/desktop/src-tauri/release-config.json | ConvertFrom-Json -AsHashtable
          $config.bundle.windows = @{certificateThumbprint=$certificate.Thumbprint; digestAlgorithm='sha256'; timestampUrl='http://timestamp.digicert.com'}
          $config | ConvertTo-Json -Depth 10 | Set-Content apps/desktop/src-tauri/release-config.json
      - run: npm ci
        working-directory: apps/desktop
      - name: Build Linux DEB
        if: runner.os == 'Linux'
        run: npm run tauri build -- --bundles deb --config src-tauri/release-config.json
        working-directory: apps/desktop
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run tauri build -- --bundles nsis --config src-tauri/release-config.json
        working-directory: apps/desktop
      - name: Verify Windows signature
        if: runner.os == 'Windows' && inputs.sign_windows
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            if ((Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid') { throw "Installer signature verification failed." }
          }
      - name: Checksums and optional detached signatures
        shell: bash
        env:
          VENTURI_SIGN_ARTIFACTS: ${{ inputs.sign_artifacts }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "$VENTURI_SIGN_ARTIFACTS" = true ] && [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'The release signing key is required.' >&2
            exit 1
          fi
          find apps/desktop/src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.exe' \) -print0 |
          while IFS= read -r -d '' artifact; do
            sha256sum "$artifact" > "$artifact.sha256"
            if [ "$VENTURI_SIGN_ARTIFACTS" = true ]; then
              artifact_path=$(realpath "$artifact")
              (cd apps/desktop && npx tauri signer sign "$artifact_path")
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: beta-installer-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/
            artifacts/release/release-manifest.json
